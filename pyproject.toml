[project]
name = "manim-demos"
version = "0.1.0"
description = "Explanatory Manim scenes with transparent PNG deliverables"
requires-python = ">=3.13"
dependencies = ["manim==0.20.1", "pillow>=11.3,<13"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manim_demos"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
